name: basira

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: basira
      POSTGRES_USER: basira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["54329:5432"]
    volumes: ["basira-postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basira -d basira"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["63799:6379"]
    volumes: ["basira-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["basira-minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/basira-private && mc anonymous set none local/basira-private"]

  analyzer-api:
    profiles: ["python"]
    build: ../services/analyzer
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010
    environment: &analyzer-env
      REDIS_URL: redis://redis:6379/0
      WEB_TO_PYTHON_HMAC_KEYS: ${WEB_TO_PYTHON_HMAC_KEYS:?Set WEB_TO_PYTHON_HMAC_KEYS}
      PYTHON_TO_WEB_HMAC_KEYS: ${PYTHON_TO_WEB_HMAC_KEYS:?Set PYTHON_TO_WEB_HMAC_KEYS}
      ANALYZER_MODE: fixture
    ports: ["8010:8010"]
    depends_on:
      redis: { condition: service_healthy }

  analyzer-worker:
    profiles: ["python"]
    build: ../services/analyzer
    command: celery -A app.tasks.celery worker --loglevel=INFO --concurrency=2
    environment: *analyzer-env
    depends_on:
      redis: { condition: service_healthy }

  ai-analyzer:
    build:
      context: ..
      dockerfile: services/ai-analyzer/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/1
      WEB_TO_PYTHON_HMAC_KEYS: ${WEB_TO_PYTHON_HMAC_KEYS:?Set WEB_TO_PYTHON_HMAC_KEYS}
      PYTHON_TO_WEB_HMAC_KEYS: ${PYTHON_TO_WEB_HMAC_KEYS:?Set PYTHON_TO_WEB_HMAC_KEYS}
      AI_ANALYZER_MODE: ${AI_ANALYZER_MODE:-fixture}
      AI_MODEL: ${AI_MODEL:-gemini-3.6-flash}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      AI_BATCH_CONCURRENCY: ${AI_BATCH_CONCURRENCY:-3}
      AI_MAX_FILE_BYTES: ${AI_MAX_FILE_BYTES:-15728640}
    ports: ["8020:8020"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8020/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  basira-postgres:
  basira-redis:
  basira-minio:
