packages:
  - "."

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  unrs-resolver: true

# New package releases are pinned explicitly after compatibility checks.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - next@16.3.0
  - react@19.2.8
  - react-dom@19.2.8
  - lucide-react@1.30.0
  - tailwindcss@4.3.3
  - "@tailwindcss/postcss@4.3.3"
  - typescript@6.0.3
  - eslint@10.8.1
  - eslint@9.39.5
  - "@types/node@26.2.0"
